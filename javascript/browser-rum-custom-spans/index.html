<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Last9 RUM custom spans</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    button { margin-right: 0.5rem; padding: 0.5rem 0.9rem; }
    pre { background: #f4f4f4; padding: 0.75rem; min-height: 8rem; overflow: auto; }
  </style>
</head>
<body>
  <h1>Custom spans with Last9 RUM</h1>
  <p id="status">Initializing SDK...</p>
  <p>
    <button id="simple">Simple span</button>
    <button id="checkout">Parent span + fetch</button>
    <button id="error">Error span</button>
  </p>
  <pre id="log"></pre>

  <!-- Sets window.L9RUM. Scripts run in document order, so this must come first. -->
  <script src="https://cdn.last9.io/rum-sdk/builds/stable/v2/l9.umd.js"></script>
  <script src="./config.js"></script>
  <script type="module">
    import { trace, SpanStatusCode } from "https://cdn.jsdelivr.net/npm/@opentelemetry/api@1.9.0/+esm";

    // Await init: it registers the tracer provider asynchronously, and spans created before that are no-ops.
    await L9RUM.init({
      baseUrl: L9_CONFIG.baseUrl,
      headers: { clientToken: L9_CONFIG.clientToken },
      resourceAttributes: {
        serviceName: L9_CONFIG.serviceName,
        deploymentEnvironment: L9_CONFIG.deploymentEnvironment,
        appVersion: "1.0.0",
      },
      sampleRate: 100,
      debug: true,
    });

    // The SDK registers its tracer provider globally (provider.register()). Any
    // @opentelemetry/api 1.x copy finds it via Symbol.for("opentelemetry.js.api.1"),
    // so these spans use the SDK's exporter with no extra setup.
    const tracer = trace.getTracer("custom-spans-demo");

    const logEl = document.getElementById("log");
    const log = (msg) => {
      logEl.textContent += `${new Date().toISOString()} ${msg}\n`;
    };

    // sendTestEvent() exists from SDK v2.13.0. Older builds skip the connection check.
    const statusEl = document.getElementById("status");
    if (typeof L9RUM.sendTestEvent === "function") {
      const r = await L9RUM.sendTestEvent();
      statusEl.textContent = r.ok
        ? `SDK ready (test event ok, status ${r.status})`
        : `Test event failed: status ${r.status}, error ${r.error}`;
    } else {
      statusEl.textContent = "SDK ready (sendTestEvent needs SDK v2.13.0+)";
    }

    document.getElementById("simple").onclick = () => {
      const span = tracer.startSpan("demo.simple");
      span.setAttribute("demo.button", "simple");
      span.setAttribute("demo.step", 1);
      log("demo.simple started");
      setTimeout(() => {
        span.end();
        log("demo.simple ended");
      }, 200);
    };

    document.getElementById("checkout").onclick = () => {
      tracer.startActiveSpan("demo.checkout", async (span) => {
        try {
          span.setAttribute("demo.button", "checkout");
          log("demo.checkout started");
          await tracer.startActiveSpan("demo.checkout.validate", async (child) => {
            await new Promise((res) => setTimeout(res, 100));
            child.end();
            log("demo.checkout.validate ended");
          });
          const res = await fetch("https://httpbin.org/delay/1");
          span.setAttribute("http.status_code", res.status);
          log(`fetch done: ${res.status}`);
        } catch (err) {
          span.recordException(err);
          span.setStatus({ code: SpanStatusCode.ERROR, message: String(err) });
          log(`demo.checkout failed: ${err}`);
        } finally {
          span.end();
          log("demo.checkout ended");
        }
      });
    };

    document.getElementById("error").onclick = () => {
      const span = tracer.startSpan("demo.error");
      const err = new Error("demo failure");
      span.recordException(err);
      span.setStatus({ code: SpanStatusCode.ERROR, message: "demo failure" });
      span.end();
      log("demo.error ended with ERROR status");
    };
  </script>
</body>
</html>
