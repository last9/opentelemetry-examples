<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Last9 RUM custom spans</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    button { margin-right: 0.5rem; padding: 0.5rem 0.9rem; }
    pre { background: #f4f4f4; padding: 0.75rem; min-height: 8rem; overflow: auto; }
  </style>
</head>
<body>
  <h1>Custom spans with Last9 RUM</h1>
  <p id="status">Initializing SDK...</p>
  <p>
    <button id="recorded">Recorded span</button>
    <button id="checkout">Timed span + fetch</button>
    <button id="error">Handled error</button>
  </p>
  <pre id="log"></pre>

  <!-- Sets window.L9RUM. Scripts run in document order, so this must come first. -->
  <script src="https://cdn.last9.io/rum-sdk/builds/stable/v2/l9.umd.js"></script>
  <script src="./config.js"></script>
  <script type="module">
    const statusEl = document.getElementById("status");
    const logEl = document.getElementById("log");
    const log = (msg) => {
      logEl.textContent += `${new Date().toISOString()} ${msg}\n`;
    };

    // recordSpan/startSpan/endSpan exist from SDK v2.14.0. A browser can keep an older
    // cached copy of the stable script; a hard refresh loads the current one.
    if (typeof L9RUM.recordSpan !== "function") {
      statusEl.textContent = "This page needs Last9 RUM SDK v2.14.0 or later. Hard-refresh to load the current stable SDK.";
      throw new Error("L9RUM.recordSpan is not available");
    }

    // Await init: custom span calls made before it resolves return false/null and emit nothing.
    await L9RUM.init({
      baseUrl: L9_CONFIG.baseUrl,
      headers: { clientToken: L9_CONFIG.clientToken },
      resourceAttributes: {
        serviceName: L9_CONFIG.serviceName,
        deploymentEnvironment: L9_CONFIG.deploymentEnvironment,
        appVersion: "1.0.0",
      },
      sampleRate: 100,
      debug: true,
    });

    // Confirms that telemetry reaches Last9 before you click anything.
    const r = await L9RUM.sendTestEvent();
    statusEl.textContent = r.ok
      ? `SDK ready (test event ok, status ${r.status})`
      : `Test event failed: status ${r.status}, error ${r.error}`;

    // A finished span: ends now, started durationMs ago.
    document.getElementById("recorded").onclick = () => {
      const ok = L9RUM.recordSpan("demo.recorded", {
        durationMs: 200,
        attributes: { "demo.button": "recorded", "demo.step": 1 },
      });
      log(`demo.recorded sent: ${ok}`);
    };

    // A span you end yourself. The fetch is recorded by the SDK as its own network span
    // (GET /delay/?) under the same page view, next to demo.checkout.
    document.getElementById("checkout").onclick = async () => {
      const handle = L9RUM.startSpan("demo.checkout", {
        kind: "client",
        attributes: { "demo.button": "checkout" },
      });
      log("demo.checkout started");
      try {
        const res = await fetch("https://httpbin.org/delay/1");
        log(`fetch done: ${res.status}`);
      } catch (err) {
        L9RUM.captureError(err, { handled: true, operation: "demo.checkout" });
        log(`fetch failed: ${err}`);
      } finally {
        log(`demo.checkout ended: ${L9RUM.endSpan(handle)}`);
      }
    };

    // Report a handled error. It shows up in Error Tracking with your attributes.
    document.getElementById("error").onclick = () => {
      L9RUM.captureError(new Error("demo failure"), { handled: true, "demo.button": "error" });
      log("demo failure captured");
    };
  </script>
</body>
</html>
