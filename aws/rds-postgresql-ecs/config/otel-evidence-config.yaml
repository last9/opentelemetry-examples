# OpenTelemetry Collector Configuration for RDS PostgreSQL Historical Evidence
# Migrating from Datadog DBM to Last9 via OTLP

receivers:
  sqlquery/blocking:
    driver: postgres
    host: ${env:PG_ENDPOINT}
    port: ${env:PG_PORT}
    database: ${env:PG_DATABASE}
    username: ${env:PG_USERNAME}
    password: ${env:PG_PASSWORD}
    additional_params:
      sslmode: verify-full
      sslrootcert: /etc/ssl/certs/rds-combined-ca-bundle.pem
    collection_interval: 5s
    timeout: 3s
    max_open_conn: 1
    queries:
      - sql: |
          WITH capture AS MATERIALIZED (
            SELECT clock_timestamp() AS captured_at
          ), activity AS MATERIALIZED (
            SELECT * FROM pg_stat_activity
          ), relationships AS MATERIALIZED (
            SELECT v.pid AS victim_pid, h.pid AS holder_pid,
              jsonb_build_object(
                'blocked', jsonb_build_object(
                  'pid', v.pid, 'backend_start', v.backend_start,
                  'database', v.datname, 'query_id', v.query_id::text,
                  'query', CASE WHEN '${env:PG_CAPTURE_QUERY_TEXT}'::boolean AND v.query != '<insufficient privilege>' THEN left(v.query, 4096) END,
                  'query_redacted', NOT '${env:PG_CAPTURE_QUERY_TEXT}'::boolean,
                  'query_truncated', '${env:PG_CAPTURE_QUERY_TEXT}'::boolean AND length(v.query) > 4096,
                  'application_name', v.application_name, 'state', v.state,
                  'transaction_start', v.xact_start),
                'holder', jsonb_build_object(
                  'pid', p.holder_pid, 'backend_start', h.backend_start,
                  'database', h.datname, 'query_id', h.query_id::text,
                  'query', CASE WHEN '${env:PG_CAPTURE_QUERY_TEXT}'::boolean AND h.query != '<insufficient privilege>' THEN left(h.query, 4096) END,
                  'query_redacted', NOT '${env:PG_CAPTURE_QUERY_TEXT}'::boolean,
                  'query_truncated', '${env:PG_CAPTURE_QUERY_TEXT}'::boolean AND length(h.query) > 4096,
                  'application_name', h.application_name, 'state', h.state,
                  'transaction_start', h.xact_start),
                'holder_missing', h.pid IS NULL,
                'insufficient_privilege', v.query = '<insufficient privilege>' OR h.query = '<insufficient privilege>',
                'wait_start', l.waitstart,
                'wait_duration_seconds', CASE WHEN l.waitstart IS NOT NULL
                  THEN greatest(0, extract(epoch FROM (c.captured_at - l.waitstart))) END,
                'lock_mode', l.mode, 'lock_type', l.locktype,
                'relation', coalesce(quote_ident(n.nspname) || '.' || quote_ident(t.relname), l.relation::text)
              ) AS evidence
            FROM activity v
            CROSS JOIN capture c
            CROSS JOIN LATERAL unnest(pg_blocking_pids(v.pid)) p(holder_pid)
            LEFT JOIN activity h ON h.pid = p.holder_pid
            LEFT JOIN LATERAL (
              SELECT waitstart, mode, locktype, relation FROM pg_locks
              WHERE pid = v.pid AND NOT granted
              ORDER BY waitstart ASC NULLS LAST LIMIT 1
            ) l ON true
            LEFT JOIN pg_class t ON t.oid = l.relation
            LEFT JOIN pg_namespace n ON n.oid = t.relnamespace
            WHERE v.datname = current_database() AND v.pid != pg_backend_pid()
          ), limited AS (
            SELECT * FROM relationships ORDER BY victim_pid, holder_pid LIMIT 100
          )
          SELECT jsonb_build_object(
            'schema_version', 1,
            'captured_at', c.captured_at,
            'snapshot_id', md5(c.captured_at::text || ':' || pg_backend_pid()::text),
            'rows_limit', 100,
            'rows_total', (SELECT count(*) FROM relationships),
            'rows_captured', (SELECT count(*) FROM limited),
            'truncated', (SELECT count(*) FROM relationships) > 100,
            'complete', '${env:PG_CAPTURE_QUERY_TEXT}'::boolean
              AND (SELECT count(*) FROM relationships) <= 100
              AND NOT EXISTS (SELECT 1 FROM limited WHERE
                (evidence->>'holder_missing')::boolean
                OR coalesce((evidence->>'insufficient_privilege')::boolean, true)
                OR coalesce((evidence->'blocked'->>'query_truncated')::boolean, false)
                OR coalesce((evidence->'holder'->>'query_truncated')::boolean, false)),
            'relationships', coalesce((SELECT jsonb_agg(evidence) FROM limited), '[]'::jsonb)
          )::text AS body
          FROM capture c
        logs:
          - body_column: body
  # PostgreSQL metrics receiver - connects directly to RDS
  postgresql:
    endpoint: ${env:PG_ENDPOINT}:${env:PG_PORT}
    transport: tcp
    username: ${env:PG_USERNAME}
    password: ${env:PG_PASSWORD}
    databases: ["${env:PG_DATABASE}"]
    exclude_databases: ${env:PG_EXCLUDE_DATABASES}
    collection_interval: 5s
    events:
      db.server.query_sample:
        enabled: true
      db.server.top_query:
        enabled: true
      db.server.query_plan:
        enabled: true
    query_sample_collection:
      max_rows_per_query: 100
    top_query_collection:
      collection_interval: 30s
      max_rows_per_query: 100
      top_n_query: 20
      max_explain_each_interval: 2
      query_plan_cache_size: 100
      query_plan_cache_ttl: 15m
    tls:
      insecure: false
      insecure_skip_verify: false
      ca_file: /etc/ssl/certs/rds-combined-ca-bundle.pem
    # All default metrics will be collected

  # Note: CloudWatch metrics receiver for RDS is not directly supported
  # PostgreSQL receiver provides comprehensive database metrics
  # CloudWatch RDS metrics are collected via the separate cloudwatch-collector container

  # Prometheus receiver for collector self-monitoring
  prometheus/self:
    config:
      scrape_configs:
        - job_name: 'otel-collector-self'
          scrape_interval: 30s
          static_configs:
            - targets: ['localhost:8888']
              labels:
                service: postgresql-collector

processors:
  transform/blocking:
    error_mode: propagate
    log_statements:
      - context: log
        statements:
          - set(attributes["event.name"], event_name) where event_name != ""
          - set(body, ParseJSON(body)) where instrumentation_scope.name == "github.com/open-telemetry/opentelemetry-collector-contrib/receiver/sqlqueryreceiver"
          - set(attributes["event.name"], "db.server.blocking_snapshot") where instrumentation_scope.name == "github.com/open-telemetry/opentelemetry-collector-contrib/receiver/sqlqueryreceiver"
          - set(attributes["db.namespace"], "${env:PG_DATABASE}") where instrumentation_scope.name == "github.com/open-telemetry/opentelemetry-collector-contrib/receiver/sqlqueryreceiver"
          - set(attributes["postgresql.query_plan.type"], "estimated_generic") where attributes["event.name"] == "db.server.query_plan"
  # Batch processing for efficiency
  batch:
    timeout: 10s
    send_batch_size: 1000
    send_batch_max_size: 1500

  # Memory limiter for stability
  memory_limiter:
    check_interval: 5s
    limit_mib: 400
    spike_limit_mib: 100

  # Add resource attributes to all telemetry
  resource:
    attributes:
      - key: service.name
        value: postgresql-collector
        action: upsert
      - key: service.version
        value: "1.0.0"
        action: upsert
      - key: deployment.environment
        value: ${env:ENVIRONMENT}
        action: upsert
      - key: db.system
        value: postgresql
        action: upsert
      - key: db.system.name
        value: postgresql
        action: upsert
      - key: server.address
        value: ${env:PG_ENDPOINT}
        action: upsert
      - key: server.port
        value: ${env:PG_PORT}
        action: upsert
      - key: cloud.provider
        value: aws
        action: upsert
      - key: cloud.platform
        value: aws_rds
        action: upsert
      - key: cloud.region
        value: ${env:AWS_REGION}
        action: upsert
      - key: db.instance.id
        value: ${env:RDS_INSTANCE_ID}
        action: upsert
      - key: aws.rds.instance.identifier
        value: ${env:RDS_INSTANCE_ID}
        action: upsert

  # Transform processor to promote resource attributes to metric labels
  transform/metrics:
    metric_statements:
      - context: datapoint
        statements:
          # Always set db_system for all PostgreSQL metrics
          - set(attributes["db_system"], "postgresql")

          # Always set these from resource processor (always available)
          - set(attributes["db_instance_id"], resource.attributes["db.instance.id"]) where resource.attributes["db.instance.id"] != nil
          - set(attributes["environment"], resource.attributes["deployment.environment"]) where resource.attributes["deployment.environment"] != nil
          - set(attributes["cloud_region"], resource.attributes["cloud.region"]) where resource.attributes["cloud.region"] != nil
          - set(attributes["cloud_provider"], resource.attributes["cloud.provider"]) where resource.attributes["cloud.provider"] != nil
          - set(attributes["cloud_platform"], resource.attributes["cloud.platform"]) where resource.attributes["cloud.platform"] != nil
          - set(attributes["service_name"], resource.attributes["service.name"]) where resource.attributes["service.name"] != nil

          # Conditionally set database name (only if metric has it)
          - set(attributes["database"], resource.attributes["postgresql.database.name"]) where resource.attributes["postgresql.database.name"] != nil
          - set(attributes["database"], resource.attributes["db.namespace"]) where resource.attributes["db.namespace"] != nil
          - set(attributes["server_address"], resource.attributes["server.address"])
          - set(attributes["server_port"], resource.attributes["server.port"])

          # Conditionally set table name (only if metric has it)
          - set(attributes["table"], resource.attributes["postgresql.table.name"]) where resource.attributes["postgresql.table.name"] != nil

          # For instance-wide metrics without database, set a default label for easier filtering
          - set(attributes["database"], "_instance_wide") where resource.attributes["postgresql.database.name"] == nil and attributes["database"] == nil
    # NOTE: Resource attributes don't automatically become Prometheus labels in OTLP export
    # We must explicitly promote them to data point attributes using the transform processor
    # Instance-wide metrics will have database="_instance_wide" for consistent filtering

  # Filter processor to drop noisy metrics if needed
  # Uncomment and add to pipeline processors list to enable
  # filter/metrics:
  #   metrics:
  #     exclude:
  #       match_type: regexp
  #       metric_names:
  #         - ".*_total$"  # Exclude if duplicating counters

exporters:
  # Last9 OTLP exporter
  otlp/last9:
    endpoint: ${env:LAST9_OTLP_ENDPOINT}
    headers:
      Authorization: ${env:LAST9_AUTH_HEADER}
    tls:
      insecure: false
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 1000

  # Debug exporter for troubleshooting (disabled in production)
  # Uncomment and add to pipeline exporters list to enable
  # debug:
  #   verbosity: detailed
  #   sampling_initial: 2
  #   sampling_thereafter: 2

extensions:
  # Health check endpoint for ECS health checks
  health_check:
    endpoint: 0.0.0.0:13133
    path: /health

  # Performance profiling pages
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, zpages]

  pipelines:
    logs:
      receivers: [postgresql, sqlquery/blocking]
      processors: [memory_limiter, resource, transform/blocking, batch]
      exporters: [otlp/last9]
    # Metrics pipeline
    metrics:
      receivers: [postgresql, prometheus/self]
      # IMPORTANT: resource processor must run BEFORE transform/metrics
      # so that resource attributes exist when transform tries to read them
      processors: [memory_limiter, resource, transform/metrics, batch]
      exporters: [otlp/last9]

  telemetry:
    logs:
      level: info
      encoding: json
      output_paths: [stdout]
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
